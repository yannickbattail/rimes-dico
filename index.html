<!doctype html>
<html lang="fr">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Rimes dico</title>
  </head>
  <body>
    <h1>Recherche de rimes en français</h1>
    <p><label for="search">Entrez la rime en phonétique (cliquez sur aide pour les phonèmes)</label></p>
    <input
      type="text"
      id="search"
      placeholder="Rechercher un mot"
      required="required"
      minlength="1"
      pattern="^[abdefgijklmnopstuvwyzøŋœɑɔəɛɥɲʁʃʒɑ̃ɛ̃œ̃ɔ̃:,.]+$"
    />
    <input type="radio" id="start" name="position" value="start" />
    <label for="start">Début</label>
    <input type="radio" id="end" name="position" value="end" checked="checked" />
    <label for="end">Fin</label>
    <input type="radio" id="contain" name="position" value="contain" />
    <label for="contain">Contient</label>
    <input type="button" value="Rechercher" onclick="search(window.dico)" />
    <img id="loading" src="loading.gif" alt="loading..." style="display: block" width="20" height="20" />
    <br />

    <div class="toggleBlock">
      <div id="help" class="toggleHide" onclick="toggle(this)">Aide</div>
      <div>
        <div>Vous pouvez cliquer sur les phonèmes pour les ajouter à la recherche</div>
        <div id="phonemesList" class="wikitable" style="display: inline-block"></div>
      </div>
    </div>

    <br />
    <div id="nbResult"></div>
    <table id="result"></table>
    <div class="source">source: https://github.com/open-dict-data/ipa-dict</div>
    <script>
      window.dico = {};
    </script>
    <script src="resources/fr_FR.js"></script>
    <script src="dist/src/script.js"></script>
    <script>
      hideLoading();
      initPhonemesList();
    </script>
  </body>
</html>
